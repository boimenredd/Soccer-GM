<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PITCH — Football Management Engine</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0c0f;
    --bg2: #111418;
    --bg3: #181c22;
    --bg4: #1f242c;
    --border: #2a3040;
    --border2: #354055;
    --text: #e8ecf4;
    --text2: #8a9ab8;
    --text3: #4a5a78;
    --accent: #00e5a0;
    --accent2: #00b87a;
    --red: #ff4a6e;
    --yellow: #ffd84d;
    --blue: #4a8fff;
    --purple: #a855f7;
    --font-display: 'Bebas Neue', sans-serif;
    --font-body: 'DM Sans', sans-serif;
    --font-mono: 'DM Mono', monospace;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font-body); font-size: 14px; overflow: hidden; }

  /* LAYOUT */
  #app { display: flex; height: 100vh; }
  #sidebar { width: 220px; min-width: 220px; background: var(--bg2); border-right: 1px solid var(--border); display: flex; flex-direction: column; z-index: 10; }
  #main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  #topbar { height: 52px; background: var(--bg2); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 24px; gap: 16px; flex-shrink: 0; }
  #content { flex: 1; overflow-y: auto; padding: 24px; }

  /* SIDEBAR */
  .sidebar-logo { padding: 20px 20px 16px; border-bottom: 1px solid var(--border); }
  .sidebar-logo h1 { font-family: var(--font-display); font-size: 32px; letter-spacing: 2px; color: var(--accent); line-height: 1; }
  .sidebar-logo p { font-size: 10px; color: var(--text3); letter-spacing: 3px; text-transform: uppercase; margin-top: 2px; }
  .sidebar-club { padding: 14px 20px; border-bottom: 1px solid var(--border); }
  .sidebar-club .club-name { font-weight: 600; font-size: 13px; color: var(--text); }
  .sidebar-club .club-meta { font-size: 11px; color: var(--text3); margin-top: 2px; }
  .sidebar-club .club-rep { display: flex; gap: 4px; margin-top: 6px; }
  .rep-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--border2); }
  .rep-dot.filled { background: var(--accent); }
  .nav-section { padding: 12px 20px 4px; font-size: 10px; letter-spacing: 3px; text-transform: uppercase; color: var(--text3); }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 20px; cursor: pointer; color: var(--text2); font-size: 13px; font-weight: 400; transition: all 0.15s; border-left: 2px solid transparent; }
  .nav-item:hover { color: var(--text); background: rgba(255,255,255,0.03); }
  .nav-item.active { color: var(--accent); border-left-color: var(--accent); background: rgba(0,229,160,0.05); }
  .nav-icon { font-size: 15px; width: 18px; text-align: center; }
  .sim-controls { margin-top: auto; padding: 16px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }
  .sim-date { font-family: var(--font-mono); font-size: 11px; color: var(--text2); text-align: center; margin-bottom: 4px; }
  .btn { padding: 8px 14px; border: none; border-radius: 6px; cursor: pointer; font-family: var(--font-body); font-weight: 500; font-size: 12px; transition: all 0.15s; }
  .btn-primary { background: var(--accent); color: #000; }
  .btn-primary:hover { background: var(--accent2); }
  .btn-secondary { background: var(--bg4); color: var(--text2); border: 1px solid var(--border); }
  .btn-secondary:hover { background: var(--bg3); color: var(--text); }
  .btn-danger { background: rgba(255,74,110,0.15); color: var(--red); border: 1px solid rgba(255,74,110,0.3); }
  .btn-danger:hover { background: rgba(255,74,110,0.25); }
  .btn-block { display: block; width: 100%; text-align: center; }

  /* TOPBAR */
  .topbar-title { font-family: var(--font-display); font-size: 22px; letter-spacing: 1px; color: var(--text); }
  .topbar-spacer { flex: 1; }
  .topbar-badge { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 500; background: var(--bg4); color: var(--text2); border: 1px solid var(--border); font-family: var(--font-mono); }
  .topbar-badge.season { color: var(--accent); border-color: rgba(0,229,160,0.3); background: rgba(0,229,160,0.08); }

  /* CARDS */
  .card { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 20px; }
  .card-sm { padding: 14px 16px; }
  .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .card-title { font-family: var(--font-display); font-size: 18px; letter-spacing: 0.5px; color: var(--text); }
  .card-title-sm { font-size: 11px; text-transform: uppercase; letter-spacing: 2px; color: var(--text3); }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
  .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }

  /* STAT BOXES */
  .stat-box { background: var(--bg3); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
  .stat-value { font-family: var(--font-display); font-size: 36px; letter-spacing: 1px; color: var(--text); line-height: 1; }
  .stat-label { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 2px; margin-top: 4px; }
  .stat-sub { font-size: 12px; color: var(--text2); margin-top: 4px; }
  .stat-change { font-size: 11px; margin-top: 6px; }
  .stat-change.up { color: var(--accent); }
  .stat-change.down { color: var(--red); }

  /* TABLES */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { padding: 8px 12px; text-align: left; font-size: 10px; font-weight: 500; letter-spacing: 2px; text-transform: uppercase; color: var(--text3); border-bottom: 1px solid var(--border); white-space: nowrap; cursor: pointer; }
  th:hover { color: var(--text2); }
  td { padding: 9px 12px; border-bottom: 1px solid rgba(42,48,64,0.5); white-space: nowrap; }
  tr:hover td { background: rgba(255,255,255,0.02); }
  tr:last-child td { border-bottom: none; }
  .td-num { font-family: var(--font-mono); font-size: 12px; text-align: right; }
  .td-rank { font-family: var(--font-mono); font-size: 11px; color: var(--text3); width: 30px; }
  .td-name { font-weight: 500; color: var(--text); }
  .td-sub { font-size: 11px; color: var(--text3); }

  /* RATINGS */
  .ovr-badge { display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: 6px; font-family: var(--font-mono); font-weight: 500; font-size: 14px; flex-shrink: 0; }
  .ovr-elite { background: rgba(0,229,160,0.15); color: var(--accent); border: 1px solid rgba(0,229,160,0.3); }
  .ovr-good { background: rgba(74,143,255,0.15); color: var(--blue); border: 1px solid rgba(74,143,255,0.3); }
  .ovr-avg { background: rgba(255,216,77,0.15); color: var(--yellow); border: 1px solid rgba(255,216,77,0.3); }
  .ovr-low { background: rgba(255,74,110,0.15); color: var(--red); border: 1px solid rgba(255,74,110,0.3); }
  .pos-badge { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: 600; letter-spacing: 1px; font-family: var(--font-mono); }
  .pos-gk { background: rgba(168,85,247,0.2); color: var(--purple); }
  .pos-def { background: rgba(74,143,255,0.2); color: var(--blue); }
  .pos-mid { background: rgba(0,229,160,0.2); color: var(--accent); }
  .pos-fwd { background: rgba(255,74,110,0.2); color: var(--red); }

  /* PROGRESS BAR */
  .prog-bar { height: 4px; background: var(--bg4); border-radius: 2px; overflow: hidden; margin-top: 4px; }
  .prog-fill { height: 100%; border-radius: 2px; transition: width 0.3s; }
  .prog-accent { background: var(--accent); }
  .prog-blue { background: var(--blue); }
  .prog-red { background: var(--red); }
  .prog-yellow { background: var(--yellow); }

  /* PITCH VIZ */
  .pitch-container { background: linear-gradient(180deg, #1a3d1a 0%, #1e4a1e 50%, #1a3d1a 100%); border-radius: 8px; position: relative; padding: 20px; min-height: 380px; border: 1px solid #2a4a2a; }
  .pitch-lines { position: absolute; inset: 0; pointer-events: none; }
  .pitch-player { position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: default; }
  .pitch-player-dot { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 600; font-family: var(--font-mono); border: 2px solid rgba(255,255,255,0.3); }
  .pitch-player-name { font-size: 8px; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.8); white-space: nowrap; max-width: 60px; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
  .team-a-dot { background: rgba(0,229,160,0.8); color: #000; }
  .team-b-dot { background: rgba(255,74,110,0.8); color: #fff; }

  /* MATCH FEED */
  .match-feed { max-height: 260px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
  .match-event { display: flex; gap: 10px; align-items: flex-start; padding: 6px 10px; border-radius: 6px; background: var(--bg3); font-size: 12px; }
  .event-min { font-family: var(--font-mono); color: var(--text3); font-size: 11px; width: 30px; flex-shrink: 0; }
  .event-icon { font-size: 14px; flex-shrink: 0; }
  .event-text { color: var(--text2); line-height: 1.4; }
  .event-text strong { color: var(--text); }
  .event-goal { background: rgba(0,229,160,0.08); border-left: 2px solid var(--accent); }
  .event-yellow { background: rgba(255,216,77,0.06); border-left: 2px solid var(--yellow); }
  .event-red { background: rgba(255,74,110,0.08); border-left: 2px solid var(--red); }
  .event-injury { background: rgba(255,74,110,0.04); }

  /* SETUP SCREEN */
  #setup-screen { position: fixed; inset: 0; background: var(--bg); z-index: 100; display: flex; align-items: center; justify-content: center; }
  .setup-inner { width: 560px; max-height: 90vh; overflow-y: auto; }
  .setup-logo { font-family: var(--font-display); font-size: 72px; letter-spacing: 4px; color: var(--accent); line-height: 1; }
  .setup-tagline { color: var(--text3); font-size: 12px; letter-spacing: 4px; text-transform: uppercase; margin-bottom: 40px; }
  .form-group { margin-bottom: 16px; }
  .form-label { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 6px; display: block; }
  .form-input { width: 100%; background: var(--bg3); border: 1px solid var(--border); border-radius: 6px; padding: 10px 14px; color: var(--text); font-family: var(--font-body); font-size: 13px; outline: none; transition: border-color 0.15s; }
  .form-input:focus { border-color: var(--accent); }
  .form-select { width: 100%; background: var(--bg3); border: 1px solid var(--border); border-radius: 6px; padding: 10px 14px; color: var(--text); font-family: var(--font-body); font-size: 13px; outline: none; cursor: pointer; }
  .team-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; max-height: 200px; overflow-y: auto; padding-right: 4px; }
  .team-pick { padding: 10px 14px; background: var(--bg3); border: 1px solid var(--border); border-radius: 6px; cursor: pointer; transition: all 0.15s; }
  .team-pick:hover { border-color: var(--border2); }
  .team-pick.selected { border-color: var(--accent); background: rgba(0,229,160,0.06); }
  .team-pick-name { font-weight: 500; font-size: 13px; }
  .team-pick-meta { font-size: 11px; color: var(--text3); margin-top: 2px; }

  /* LOADING */
  .loading-bar { height: 2px; background: var(--bg3); border-radius: 1px; overflow: hidden; margin-top: 12px; }
  .loading-fill { height: 100%; background: var(--accent); width: 0%; transition: width 0.3s; }

  /* SCROLLBAR */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text3); }

  /* SEARCH */
  .search-input { background: var(--bg3); border: 1px solid var(--border); border-radius: 6px; padding: 8px 12px; color: var(--text); font-family: var(--font-body); font-size: 13px; outline: none; transition: border-color 0.15s; width: 220px; }
  .search-input:focus { border-color: var(--accent); }
  .filter-row { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }

  /* TRANSFER */
  .player-card-inline { display: flex; align-items: center; gap: 12px; padding: 10px 14px; background: var(--bg3); border-radius: 8px; border: 1px solid var(--border); transition: border-color 0.15s; cursor: pointer; }
  .player-card-inline:hover { border-color: var(--border2); }
  .player-info-block { flex: 1; min-width: 0; }

  /* TOAST */
  #toast { position: fixed; bottom: 24px; right: 24px; z-index: 999; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
  .toast-item { padding: 10px 16px; border-radius: 8px; font-size: 13px; color: #000; animation: slideIn 0.3s ease; max-width: 300px; font-weight: 500; }
  .toast-success { background: var(--accent); }
  .toast-error { background: var(--red); color: #fff; }
  .toast-info { background: var(--yellow); }
  @keyframes slideIn { from { transform: translateX(40px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

  /* MODAL */
  #modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 200; display: none; align-items: center; justify-content: center; }
  #modal-overlay.open { display: flex; }
  .modal-box { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 28px; width: 520px; max-width: 96vw; max-height: 85vh; overflow-y: auto; }
  .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .modal-close { background: none; border: none; color: var(--text3); cursor: pointer; font-size: 20px; transition: color 0.15s; }
  .modal-close:hover { color: var(--text); }

  /* TABS */
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
  .tab { padding: 8px 16px; cursor: pointer; font-size: 13px; color: var(--text3); border-bottom: 2px solid transparent; transition: all 0.15s; margin-bottom: -1px; }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab:hover { color: var(--text2); }

  /* INLINE BADGE */
  .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: 600; letter-spacing: 0.5px; }
  .badge-green { background: rgba(0,229,160,0.15); color: var(--accent); }
  .badge-red { background: rgba(255,74,110,0.15); color: var(--red); }
  .badge-yellow { background: rgba(255,216,77,0.15); color: var(--yellow); }
  .badge-blue { background: rgba(74,143,255,0.15); color: var(--blue); }

  /* LEAGUE TABLE specifics */
  .form-badges { display: flex; gap: 3px; }
  .form-w { width: 14px; height: 14px; border-radius: 3px; background: var(--accent); display: inline-block; }
  .form-d { width: 14px; height: 14px; border-radius: 3px; background: var(--yellow); display: inline-block; }
  .form-l { width: 14px; height: 14px; border-radius: 3px; background: var(--red); display: inline-block; }

  /* ATTR BLOCK */
  .attr-group { margin-bottom: 14px; }
  .attr-group-title { font-size: 10px; text-transform: uppercase; letter-spacing: 2px; color: var(--text3); margin-bottom: 8px; }
  .attr-row { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .attr-name { width: 110px; font-size: 12px; color: var(--text2); flex-shrink: 0; }
  .attr-val { font-family: var(--font-mono); font-size: 12px; width: 30px; text-align: right; flex-shrink: 0; }
  .attr-bar { flex: 1; height: 4px; background: var(--bg4); border-radius: 2px; overflow: hidden; }
  .attr-bar-fill { height: 100%; border-radius: 2px; }

  /* Responsive hide */
  @media (max-width: 900px) { .grid-4 { grid-template-columns: 1fr 1fr; } }
</style>
</head>
<body>

<!-- SETUP SCREEN -->
<div id="setup-screen">
  <div class="setup-inner">
    <div class="setup-logo">PITCH</div>
    <div class="setup-tagline">Football Management Engine</div>
    <div class="card" style="margin-bottom:20px;">
      <div class="card-header"><span class="card-title">New Save</span></div>
      <div class="form-group">
        <label class="form-label">Manager Name</label>
        <input class="form-input" id="mgr-name" placeholder="Enter your name..." value="Alex Ferguson Jr">
      </div>
      <div class="form-group">
        <label class="form-label">Select League</label>
        <select class="form-select" id="league-pick" onchange="renderTeamPicker()">
          <option value="EPL">English Premier League</option>
          <option value="LaLiga">La Liga</option>
          <option value="Bundesliga">Bundesliga</option>
          <option value="SerieA">Serie A</option>
          <option value="Ligue1">Ligue 1</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Choose Your Club</label>
        <div class="team-grid" id="team-picker"></div>
      </div>
      <div id="setup-loading" style="display:none;">
        <div class="loading-bar"><div class="loading-fill" id="loading-fill"></div></div>
        <p style="font-size:11px;color:var(--text3);margin-top:8px;text-align:center;">Generating world...</p>
      </div>
    </div>
    <button class="btn btn-primary btn-block" style="font-size:15px;padding:14px;" onclick="startGame()">KICK OFF</button>
  </div>
</div>

<!-- MAIN APP -->
<div id="app" style="display:none;">
  <!-- SIDEBAR -->
  <div id="sidebar">
    <div class="sidebar-logo"><h1>PITCH</h1><p>Football Engine</p></div>
    <div class="sidebar-club">
      <div class="club-name" id="sb-club-name">—</div>
      <div class="club-meta" id="sb-club-meta">—</div>
      <div class="club-rep" id="sb-club-rep"></div>
    </div>
    <div class="nav-section">Club</div>
    <div class="nav-item active" onclick="navigate('dashboard')"><span class="nav-icon">⚡</span>Dashboard</div>
    <div class="nav-item" onclick="navigate('squad')"><span class="nav-icon">👥</span>Squad</div>
    <div class="nav-item" onclick="navigate('tactics')"><span class="nav-icon">🎯</span>Tactics</div>
    <div class="nav-item" onclick="navigate('finances')"><span class="nav-icon">💰</span>Finances</div>
    <div class="nav-section">Competition</div>
    <div class="nav-item" onclick="navigate('fixtures')"><span class="nav-icon">📅</span>Fixtures</div>
    <div class="nav-item" onclick="navigate('table')"><span class="nav-icon">📊</span>League Table</div>
    <div class="nav-item" onclick="navigate('transfers')"><span class="nav-icon">🔄</span>Transfers</div>
    <div class="nav-section">World</div>
    <div class="nav-item" onclick="navigate('players')"><span class="nav-icon">🌍</span>Players</div>
    <div class="nav-item" onclick="navigate('history')"><span class="nav-icon">🏆</span>History</div>
    <div class="sim-controls">
      <div class="sim-date" id="sim-date">—</div>
      <button class="btn btn-primary btn-block" onclick="simNextMatch()">▶ Next Match</button>
      <button class="btn btn-secondary btn-block" onclick="simWeek()">⏩ Sim Week</button>
      <button class="btn btn-secondary btn-block" onclick="simMonth()">⏭ Sim Month</button>
    </div>
  </div>

  <!-- MAIN -->
  <div id="main">
    <div id="topbar">
      <span class="topbar-title" id="page-title">Dashboard</span>
      <span class="topbar-spacer"></span>
      <span class="topbar-badge season" id="tb-season">Season 1</span>
      <span class="topbar-badge" id="tb-budget">£0M</span>
      <span class="topbar-badge" id="tb-position">Pos —</span>
    </div>
    <div id="content"></div>
  </div>
</div>

<!-- MODAL -->
<div id="modal-overlay">
  <div class="modal-box" id="modal-box">
    <div class="modal-header">
      <span class="card-title" id="modal-title">Details</span>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div id="modal-content"></div>
  </div>
</div>

<!-- TOAST -->
<div id="toast"></div>

<script>
// ================================================================
// ENGINE CORE — PITCH Football Simulation Engine v1.0
// ================================================================

// ---- CONSTANTS ----
const POSITIONS = ['GK','CB','CB','LB','RB','CDM','CM','CM','CAM','LW','ST'];
const POSITION_TYPES = { GK:'gk', CB:'def', LB:'def', RB:'def', CDM:'mid', CM:'mid', CAM:'mid', LW:'fwd', RW:'fwd', ST:'fwd', CF:'fwd' };
const FORMATIONS = {
  '4-3-3': ['GK','LB','CB','CB','RB','CM','CM','CM','LW','ST','RW'],
  '4-2-3-1': ['GK','LB','CB','CB','RB','CDM','CDM','CAM','LW','RW','ST'],
  '4-4-2': ['GK','LB','CB','CB','RB','LM','CM','CM','RM','ST','ST'],
  '3-5-2': ['GK','CB','CB','CB','LWB','CM','CDM','CM','RWB','ST','ST'],
  '5-3-2': ['GK','LWB','CB','CB','CB','RWB','CM','CM','CM','ST','ST'],
};
const FORMATION_COORDS = {

function generatePlayer(opts={}) {
  const age = opts.age || rand(16, 34);
  const pos = opts.pos || pick(Object.keys(POSITION_TYPES));
  const ptype = POSITION_TYPES[pos] || 'mid';
  const potential = opts.potential || rand(55, 97);
  const devFactor = age < 24 ? rand(60, 90) / 100 : age < 30 ? rand(85, 100) / 100 : rand(70, 92) / 100;
  const baseSkill = Math.round(potential * devFactor);
  const spread = (lo, hi) => clamp(rand(baseSkill - hi, baseSkill + lo), 30, 99);

  const attrs = {
    // Technical
    finishing: spread(10, 20),
    passing: spread(10, 20),
    dribbling: spread(10, 20),
    firstTouch: spread(8, 15),
    crossing: spread(12, 20),
    longShots: spread(15, 25),
    tackling: spread(10, 20),
    // Physical
    pace: spread(15, 25),
    acceleration: spread(12, 20),
    strength: spread(12, 20),
    stamina: spread(10, 18),
    jumping: spread(12, 20),
    agility: spread(10, 18),
    // Mental
    vision: spread(10, 18),
    composure: spread(10, 18),
    decisions: spread(10, 18),
    positioning: spread(8, 15),
    workRate: spread(8, 15),
    aggression: spread(12, 20),
    // GK
    reflexes: spread(10, 20),
    handling: spread(10, 20),
    gkPositioning: spread(10, 20),
    diving: spread(10, 20),
    kicking: spread(12, 22),
  };

  // Position bias
  if (ptype === 'fwd') { attrs.finishing = clamp(attrs.finishing + rand(5,15), 40, 99); attrs.pace = clamp(attrs.pace + rand(3,10), 40, 99); }
  if (ptype === 'mid') { attrs.passing = clamp(attrs.passing + rand(5,12), 40, 99); attrs.vision = clamp(attrs.vision + rand(5,12), 40, 99); }
  if (ptype === 'def') { attrs.tackling = clamp(attrs.tackling + rand(5,15), 40, 99); attrs.strength = clamp(attrs.strength + rand(5,12), 40, 99); }
  if (ptype === 'gk') { attrs.reflexes = clamp(attrs.reflexes + rand(10,20), 40, 99); attrs.handling = clamp(attrs.handling + rand(10,20), 40, 99); attrs.gkPositioning = clamp(attrs.gkPositioning + rand(10,20), 40, 99); attrs.diving = clamp(attrs.diving + rand(10,20), 40, 99); }

  const overall = calcOverall(attrs, pos);

  return {
    id: uid(), name: `${pick(FIRST_NAMES)} ${pick(LAST_NAMES)}`,
    nationality: pick(NATIONALITIES), age, pos,
    height: rand(165, 198), weight: rand(65, 95),
    foot: Math.random() > 0.15 ? 'Right' : 'Left',
    attrs, overall, potential,
    form: rand(60, 80), morale: rand(60, 80),
    injuryRisk: rand(1, 30), injured: false, injuryEnd: null,
    contract: { salary: calcWage(overall), expires: G.season + rand(1,4) },
    value: calcValue(overall, age, potential),
    teamId: opts.teamId || null, loaned: false,
    stats: { goals:0, assists:0, apps:0, rating:0, shots:0, tackles:0, saves:0 },
    careerStats: { goals:0, assists:0, apps:0 },
    forSale: false, transferListed: false,
  };
}

function calcOverall(a, pos) {
  const t = POSITION_TYPES[pos] || 'mid';
  let score;
  if (t === 'gk') score = avg([a.reflexes, a.handling, a.gkPositioning, a.diving, a.kicking]);
  else if (t === 'def') score = avg([a.tackling, a.strength, a.positioning, a.jumping, a.composure, a.pace]);
  else if (t === 'mid') score = avg([a.passing, a.vision, a.stamina, a.decisions, a.firstTouch, a.composure]);
  else score = avg([a.finishing, a.positioning, a.composure, a.pace, a.dribbling, a.firstTouch]);
  return Math.round(score);
}

function avg(arr) { return arr.reduce((a,b) => a+b, 0) / arr.length; }
function calcWage(ovr) { return Math.round((ovr * ovr * 15) * (0.8 + Math.random() * 0.4)); }
function calcValue(ovr, age, pot) {
  const ageMult = age < 24 ? 1.4 : age < 28 ? 1.1 : age < 32 ? 0.8 : 0.4;
  const potMult = pot > 85 ? 1.3 : pot > 75 ? 1.1 : 1.0;
  return Math.round(ovr * ovr * 1200 * ageMult * potMult);
}
function ovrClass(v) { return v >= 82 ? 'ovr-elite' : v >= 72 ? 'ovr-good' : v >= 62 ? 'ovr-avg' : 'ovr-low'; }
function posClass(p) { const t = POSITION_TYPES[p]; return `pos-${t}`; }

function generateFixtures(leagueId) {
  const lg = G.leagues[leagueId];
  const tids = [...lg.teams];
  const fixtures = [];
  // Round-robin double
  for (let r = 0; r < tids.length - 1; r++) {
    const matchday = [];
    for (let i = 0; i < tids.length / 2; i++) {
      const h = tids[i], a = tids[tids.length - 1 - i];
      if (h !== undefined && a !== undefined) matchday.push({ id: uid(), homeId: h, awayId: a, leagueId, played: false, result: null, matchday: r + 1, date: new Date(G.date.getTime() + r * 7 * 86400000) });
    }
    fixtures.push(...matchday);
    tids.splice(1, 0, tids.pop());
  }
  const n = fixtures.length;
  for (let i = 0; i < n; i++) {
    fixtures.push({ ...fixtures[i], id: uid(), homeId: fixtures[i].awayId, awayId: fixtures[i].homeId, matchday: fixtures[i].matchday + tids.length - 1, date: new Date(fixtures[i].date.getTime() + (tids.length - 1) * 7 * 86400000) });
  }
  G.fixtures.push(...fixtures);
}

function simulateMatch(fixture) {
  const home = G.teams.find(t => t.id === fixture.homeId);
  const away = G.teams.find(t => t.id === fixture.awayId);
  if (!home || !away) return null;

  const getSquad = team => team.squad.map(id => G.players.find(p => p.id === id)).filter(Boolean);
  const squadPower = squad => {
    const sorted = squad.sort((a,b) => b.overall - a.overall).slice(0, 11);
    return sorted.reduce((s,p) => s + p.overall, 0) / 11;
  };

  const homePlayers = getSquad(home);
  const awayPlayers = getSquad(away);
  const homePow = squadPower(homePlayers) + rand(-5, 8); // home advantage
  const awayPow = squadPower(awayPlayers) + rand(-5, 5);

  const total = homePow + awayPow;
  const homeDom = homePow / total;

  const homeShots = Math.round(randF(4, 18) * homeDom + rand(-2, 2));
  const awayShots = Math.round(randF(4, 18) * (1 - homeDom) + rand(-2, 2));
  const homeSot = Math.round(homeShots * randF(0.3, 0.55));
  const awaySot = Math.round(awayShots * randF(0.3, 0.55));

  const homeXg = homeSot * randF(0.25, 0.45);
  const awayXg = awaySot * randF(0.25, 0.45);

  const homeGoals = Math.round(homeXg * randF(0.6, 1.5));
  const awayGoals = Math.round(awayXg * randF(0.6, 1.5));

  const clampG = v => Math.max(0, Math.min(12, v));
  const hg = clampG(homeGoals), ag = clampG(awayGoals);

  const events = generateEvents(home, away, homePlayers, awayPlayers, hg, ag);

  // Update stats
  events.filter(e => e.type === 'goal').forEach(e => {
    const scorer = G.players.find(p => p.id === e.playerId);
    if (scorer) { scorer.stats.goals++; scorer.careerStats.goals++; }
    if (e.assistId) {
      const assist = G.players.find(p => p.id === e.assistId);
      if (assist) { assist.stats.assists++; assist.careerStats.assists++; }
    }
  });
  [...homePlayers.slice(0,11), ...awayPlayers.slice(0,11)].forEach(p => {
    if (p) { p.stats.apps++; p.careerStats.apps++; p.stats.rating = ((p.stats.rating * (p.stats.apps-1)) + calcPlayerRating(p, events)) / p.stats.apps; }
  });

  const possession = Math.round(homeDom * 60 + rand(-8, 8));

  const result = {
    id: fixture.id, homeId: fixture.homeId, awayId: fixture.awayId,
    hg, ag, leagueId: fixture.leagueId,
    stats: {
      homePossession: clamp(possession, 25, 75), awayPossession: clamp(100 - possession, 25, 75),
      homeShots, awayShots, homeSot, awaySot,
      homeXg: homeXg.toFixed(2), awayXg: awayXg.toFixed(2),
      homeCorners: rand(2, 10), awayCorners: rand(2, 10),
      homeFouls: rand(5, 18), awayFouls: rand(5, 18),
    },
    events, date: fixture.date
  };

  updateLeagueTable(fixture.leagueId, fixture.homeId, fixture.awayId, hg, ag);
  return result;
}

function generateEvents(home, away, homePlayers, awayPlayers, hg, ag) {
  const events = [];
  const usedMins = new Set();
  const pickMin = () => { let m; do { m = rand(1, 90); } while (usedMins.has(m)); usedMins.add(m); return m; };
  const pickScorer = (players, pos) => {
    const fwd = players.filter(p => POSITION_TYPES[p.pos] === 'fwd');
    const mid = players.filter(p => POSITION_TYPES[p.pos] === 'mid');
    const pool = fwd.length ? [...fwd, ...fwd, ...mid] : players;
    return pick(pool);
  };
  const pickAssist = (players, scorer) => {
    const p = players.filter(x => x.id !== scorer.id);
    return Math.random() > 0.15 ? pick(p) : null;
  };

  for (let i = 0; i < hg; i++) {
    const scorer = pickScorer(homePlayers);
    const assist = pickAssist(homePlayers, scorer);
    if (scorer) events.push({ type:'goal', team:'home', min: pickMin(), playerId: scorer.id, playerName: scorer.name, assistId: assist?.id, assistName: assist?.name });
  }
  for (let i = 0; i < ag; i++) {
    const scorer = pickScorer(awayPlayers);
    const assist = pickAssist(awayPlayers, scorer);
    if (scorer) events.push({ type:'goal', team:'away', min: pickMin(), playerId: scorer.id, playerName: scorer.name, assistId: assist?.id, assistName: assist?.name });
  }

  // Yellow cards
  const yellows = rand(1, 6);
  for (let i = 0; i < yellows; i++) {
    const team = Math.random() > 0.5 ? 'home' : 'away';
    const players = team === 'home' ? homePlayers : awayPlayers;
    const p = pick(players);
    if (p) events.push({ type:'yellow', team, min: pickMin(), playerId: p.id, playerName: p.name });
  }
  // Injuries
  if (Math.random() < 0.15) {
    const team = Math.random() > 0.5 ? 'home' : 'away';
    const players = team === 'home' ? homePlayers : awayPlayers;
    const p = pick(players);
    if (p) { p.injured = true; p.injuryEnd = G.season + 1; events.push({ type:'injury', team, min: pickMin(), playerId: p.id, playerName: p.name }); }
  }
  events.sort((a, b) => a.min - b.min);
  return events;
}

function calcPlayerRating(player, events) {
  let rating = 6.0;
  const goals = events.filter(e => e.type === 'goal' && e.playerId === player.id).length;
  const assists = events.filter(e => e.type === 'goal' && e.assistId === player.id).length;
  const yellows = events.filter(e => e.type === 'yellow' && e.playerId === player.id).length;
  rating += goals * 1.2 + assists * 0.7 - yellows * 0.4 + (player.overall - 70) * 0.02;
  return parseFloat(clamp(rating, 4.0, 10.0).toFixed(1));
}

function updateLeagueTable(leagueId, homeId, awayId, hg, ag) {
  const lg = G.leagues[leagueId];
  if (!lg) return;
  const getRow = id => lg.table.find(r => r.id === id);
  const hr = getRow(homeId), ar = getRow(awayId);
  const ht = G.teams.find(t => t.id === homeId), at = G.teams.find(t => t.id === awayId);
  if (!hr || !ar) return;

  if (hg > ag) { hr.w++; hr.pts += 3; ar.l++; ht.form.push('W'); at.form.push('L'); hr.form.push('W'); ar.form.push('L'); }
  else if (hg < ag) { ar.w++; ar.pts += 3; hr.l++; at.form.push('W'); ht.form.push('L'); ar.form.push('W'); hr.form.push('L'); }
  else { hr.d++; ar.d++; hr.pts++; ar.pts++; ht.form.push('D'); at.form.push('D'); hr.form.push('D'); ar.form.push('D'); }

  hr.gf += hg; hr.ga += ag; ar.gf += ag; ar.ga += hg;
  ht.stats = { w: hr.w, d: hr.d, l: hr.l, gf: hr.gf, ga: hr.ga, pts: hr.pts };
  at.stats = { w: ar.w, d: ar.d, l: ar.l, gf: ar.gf, ga: ar.ga, pts: ar.pts };
  if (ht.form.length > 5) ht.form = ht.form.slice(-5);
  if (at.form.length > 5) at.form = at.form.slice(-5);
  if (hr.form.length > 5) hr.form = hr.form.slice(-5);
  if (ar.form.length > 5) ar.form = ar.form.slice(-5);

  lg.table.sort((a, b) => b.pts - a.pts || (b.gf - b.ga) - (a.gf - a.ga) || b.gf - a.gf);
}

function runAiTransferWindow() {
  G.teams.forEach(team => {
    if (team.id === G.playerTeamId) return;
    // Release old players
    team.squad = team.squad.filter(id => {
      const p = G.players.find(x => x.id === id);
      return p && p.age < 36;
    });
    // Generate youth
    if (Math.random() < 0.3) {
      const pos = pick(Object.keys(POSITION_TYPES));
      const p = generatePlayer({ pos, age: rand(17, 21), teamId: team.id, potential: rand(55, 85) });
      G.players.push(p);
      team.squad.push(p.id);
    }
  });
}

function runPlayerDevelopment() {
  G.players.forEach(p => {
    // Age
    p.age++;
    // Development / decline
    const growRate = p.age < 24 ? rand(0, 3) : p.age < 28 ? rand(-1, 1) : p.age < 32 ? rand(-2, 0) : rand(-4, -1);
    Object.keys(p.attrs).forEach(k => {
      p.attrs[k] = clamp(p.attrs[k] + growRate + rand(-1, 1), 30, 99);
    });
    p.overall = calcOverall(p.attrs, p.pos);
    p.value = calcValue(p.overall, p.age, p.potential);
    p.form = clamp(p.form + rand(-5, 5), 40, 90);
    p.morale = clamp(p.morale + rand(-3, 3), 30, 95);
    // Retire
    if (p.age > 36 && Math.random() < 0.5) p.retired = true;
    // Contract expire
    if (p.contract.expires <= G.season) { p.contract.expires = G.season + rand(1, 3); p.contract.salary = calcWage(p.overall); }
    // Recovery
    if (p.injured && p.injuryEnd <= G.season) p.injured = false;
  });
  // Remove retired
  G.players = G.players.filter(p => !p.retired);
  G.teams.forEach(t => { t.squad = t.squad.filter(id => G.players.find(p => p.id === id)); });
}

function endSeason() {
  // Record champion
  const leagueId = Object.keys(G.leagues)[0];
  const lg = G.leagues[leagueId];
  const champion = G.teams.find(t => t.id === lg.table[0]?.id);
  if (champion) {
    G.history.push({ season: G.season, league: lg.name, champion: champion.name, pts: lg.table[0]?.pts || 0, date: new Date(G.date) });
    toast(`🏆 ${champion.name} win the ${lg.name}!`, 'info');
  }
  // Reset stats
  G.teams.forEach(t => { t.stats = { w:0,d:0,l:0,gf:0,ga:0,pts:0 }; t.form = []; });
  lg.table.forEach(r => { r.w=0;r.d=0;r.l=0;r.gf=0;r.ga=0;r.pts=0;r.form=[]; });
  G.players.forEach(p => { p.stats = { goals:0,assists:0,apps:0,rating:0,shots:0,tackles:0,saves:0 }; });
  // Development
  runPlayerDevelopment();
  runAiTransferWindow();
  G.season++;
  G.fixtures = [];
  generateFixtures(leagueId);
  updateTopbar();
  toast(`⚽ Season ${G.season} begins!`, 'success');
}

    const home = G.teams.find(t => t.id === myResult.homeId)?.name;
    const away = G.teams.find(t => t.id === myResult.awayId)?.name;
    toast(`${home} ${myResult.hg} - ${myResult.ag} ${away}`, myResult.homeId === G.playerTeamId ? (myResult.hg > myResult.ag ? 'success' : myResult.hg < myResult.ag ? 'error' : 'info') : 'info');
  }
}

function simWeek() {
  for (let i = 0; i < 2; i++) simNextMatch();
}
function simMonth() {
  for (let i = 0; i < 8; i++) simNextMatch();
}

function checkSeasonEnd() {
  const leagueId = Object.keys(G.leagues)[0];
  const unplayed = G.fixtures.filter(f => !f.played && f.leagueId === leagueId);
  if (unplayed.length === 0) endSeason();
}

// ================================================================
// UI — NAVIGATION
// ================================================================
let G_currentPage = 'dashboard';

function navigate(page) {
  G_currentPage = page;
  document.querySelectorAll('.nav-item').forEach(el => {
    el.classList.toggle('active', el.textContent.trim().toLowerCase().includes(page.toLowerCase()) || (page==='dashboard' && el.textContent.includes('Dashboard')));
  });
  document.getElementById('page-title').textContent = page.charAt(0).toUpperCase() + page.slice(1);
  const content = document.getElementById('content');
  switch(page) {
    case 'dashboard': content.innerHTML = renderDashboard(); break;
    case 'squad': content.innerHTML = renderSquad(); break;
    case 'tactics': content.innerHTML = renderTactics(); break;
    case 'fixtures': content.innerHTML = renderFixtures(); break;
    case 'table': content.innerHTML = renderTable(); break;
    case 'transfers': content.innerHTML = renderTransfers(); break;
    case 'players': content.innerHTML = renderAllPlayers(); break;
    case 'history': content.innerHTML = renderHistory(); break;
    case 'finances': content.innerHTML = renderFinances(); break;
    default: content.innerHTML = renderDashboard();
  }
  updateTopbar();
}

function updateTopbar() {
  const team = G.teams.find(t => t.id === G.playerTeamId);
  if (!team) return;
  document.getElementById('tb-season').textContent = `Season ${G.season}`;
  document.getElementById('tb-budget').textContent = money(team.finances.transferBudget);
  const leagueId = team.leagueId;
  const lg = G.leagues[leagueId];
  const pos = lg ? lg.table.findIndex(r => r.id === G.playerTeamId) + 1 : '—';
  document.getElementById('tb-position').textContent = `${pos}${pos === 1 ? 'st' : pos === 2 ? 'nd' : pos === 3 ? 'rd' : 'th'}`;
  document.getElementById('sim-date').textContent = formatDate(G.date);
  document.getElementById('sb-club-name').textContent = team.name;
  document.getElementById('sb-club-meta').textContent = `${team.country} · ${G.leagues[leagueId]?.name || ''}`;
  const repEl = document.getElementById('sb-club-rep');
  repEl.innerHTML = Array.from({length:5}, (_,i) => `<div class="rep-dot${i < Math.round(team.rep/20) ? ' filled' : ''}"></div>`).join('');
}

function renderDashboard() {

  const recentResults = G.results.filter(r => r.homeId === G.playerTeamId || r.awayId === G.playerTeamId).slice(-5);

    </div>
    <div class="stat-box">
      <div class="stat-value">${avgOvr}</div>
      <div class="stat-label">Squad Average</div>
      <div class="stat-sub">${players.length} players</div>
    </div>
    <div class="stat-box">
      <div class="stat-value">${team.stats.w}-${team.stats.d}-${team.stats.l}</div>
      <div class="stat-label">W / D / L</div>
      <div class="stat-sub">${team.stats.gf} scored, ${team.stats.ga} conceded</div>
    </div>
    <div class="stat-box">
      <div class="stat-value">${money(team.finances.transferBudget)}</div>
      <div class="stat-label">Transfer Budget</div>
      <div class="stat-sub">${money(team.finances.wageBudget)} wages</div>
    </div>
  </div>

  <div class="grid-2" style="margin-bottom:20px;">
    <div class="card">
      <div class="card-header"><span class="card-title">Recent Results</span></div>
      ${recentResults.length ? recentResults.reverse().map(r => {
        const hn = G.teams.find(t => t.id === r.homeId)?.name || '?';
        const an = G.teams.find(t => t.id === r.awayId)?.name || '?';
        const isHome = r.homeId === G.playerTeamId;
        const won = isHome ? r.hg > r.ag : r.ag > r.hg;
        const draw = r.hg === r.ag;
        return `<div style="display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;">
          <span class="badge ${draw?'badge-yellow':won?'badge-green':'badge-red'}">${draw?'D':won?'W':'L'}</span>
          <span style="flex:1;color:var(--text2);">${hn} <span style="color:var(--text);font-weight:600;">${r.hg}–${r.ag}</span> ${an}</span>
          <span style="font-size:11px;color:var(--text3);">${formatDate(r.date)}</span>
        </div>`;
      }).join('') : '<p style="color:var(--text3);font-size:13px;">No results yet</p>'}
    </div>
    <div class="card">
      <div class="card-header"><span class="card-title">Upcoming Fixtures</span></div>
      ${nextFixtures.length ? nextFixtures.map(f => {
        const hn = G.teams.find(t => t.id === f.homeId)?.name || '?';
        const an = G.teams.find(t => t.id === f.awayId)?.name || '?';
        return `<div style="display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;">
          <span style="font-family:var(--font-mono);font-size:10px;color:var(--text3);width:50px;">MD ${f.matchday}</span>

  <div class="grid-2">
    <div class="card">
      <div class="card-header"><span class="card-title">Top Performers</span></div>
      <table><thead><tr><th>Player</th><th>Pos</th><th>OVR</th><th>G</th><th>A</th><th>Rating</th></tr></thead><tbody>
      ${[...players].sort((a,b) => b.stats.goals - a.stats.goals || b.stats.assists - a.stats.assists).slice(0,8).map(p => `
        <tr onclick="showPlayerModal(${p.id})" style="cursor:pointer;">
          <td><span class="td-name">${p.name}</span></td>
          <td><span class="pos-badge ${posClass(p.pos)}">${p.pos}</span></td>

          <td class="td-num">${p.stats.goals}</td>

function renderSquad() {
  const team = G.teams.find(t => t.id === G.playerTeamId);
  const players = team.squad.map(id => G.players.find(p => p.id === id)).filter(Boolean).sort((a,b) => {
    const order = ['GK','CB','LB','RB','CDM','CM','CAM','LM','RM','LW','RW','ST','CF'];
    return (order.indexOf(a.pos) - order.indexOf(b.pos)) || b.overall - a.overall;
  });
  return `
  <div class="card" style="margin-bottom:16px;">
    <div class="card-header"><span class="card-title">Squad (${players.length})</span>
      <div style="display:flex;gap:8px;">
        <input class="search-input" id="squad-search" placeholder="Search players..." oninput="filterSquad()" style="width:180px;">
      </div>
    </div>
    <div class="table-wrap" id="squad-table">
      ${renderSquadTable(players)}
    </div>
  </div>`;
}

function renderSquadTable(players) {
  return `<table><thead><tr>
    <th>Name</th><th>Nat.</th><th>Age</th><th>Pos</th><th>OVR</th><th>POT</th>
    <th>PAC</th><th>SHO</th><th>PAS</th><th>DRI</th><th>DEF</th><th>PHY</th>
    <th>Value</th><th>Wage</th><th>Form</th>

  ${players.map(p => {
    const pac = Math.round((p.attrs.pace + p.attrs.acceleration)/2);
    const sho = Math.round((p.attrs.finishing + p.attrs.longShots)/2);
    const pas = Math.round((p.attrs.passing + p.attrs.vision)/2);
    const dri = Math.round((p.attrs.dribbling + p.attrs.agility)/2);
    const def = Math.round((p.attrs.tackling + p.attrs.positioning)/2);

    return `<tr onclick="showPlayerModal(${p.id})" style="cursor:pointer;">
      <td><span class="td-name">${p.name}${p.injured ? ' 🤕' : ''}</span></td>

      <td class="td-num">${pac}</td><td class="td-num">${sho}</td>
      <td class="td-num">${pas}</td><td class="td-num">${dri}</td>

      <td><div style="display:flex;gap:2px;">${(p.form >= 75 ? '🟢' : p.form >= 55 ? '🟡' : '🔴')}</div></td>
    </tr>`;
  }).join('')}
  </tbody></table>`;
}

function filterSquad() {
  const q = document.getElementById('squad-search')?.value.toLowerCase() || '';
  const team = G.teams.find(t => t.id === G.playerTeamId);
  const players = team.squad.map(id => G.players.find(p => p.id === id)).filter(Boolean).filter(p => p.name.toLowerCase().includes(q) || p.pos.toLowerCase().includes(q) || p.nationality.toLowerCase().includes(q));
  const tbl = document.getElementById('squad-table');
  if (tbl) tbl.innerHTML = renderSquadTable(players);
}

function renderTactics() {
  const team = G.teams.find(t => t.id === G.playerTeamId);
  const formation = G.formation;
  const positions = FORMATIONS[formation] || FORMATIONS['4-3-3'];
  const coords = FORMATION_COORDS[formation] || FORMATION_COORDS['4-3-3'];
  const players = team.squad.map(id => G.players.find(p => p.id === id)).filter(Boolean).sort((a,b) => b.overall - a.overall);

  const assigned = positions.map((pos, i) => {
    const ideal = players.filter(p => p.pos === pos || (pos.includes('CB') && p.pos === 'CB') || (pos.includes('CM') && p.pos === 'CM'));
    return ideal[0] || players[i] || null;
  });

  return `
  <div class="grid-2">
    <div class="card">
      <div class="card-header">
        <span class="card-title">Formation</span>
        <select class="form-select" style="width:auto;padding:6px 12px;" onchange="G.formation=this.value;navigate('tactics')">
          ${Object.keys(FORMATIONS).map(f => `<option value="${f}"${f===formation?' selected':''}>${f}</option>`).join('')}
        </select>
      </div>
      <div class="pitch-container" id="pitch">
        <svg class="pitch-lines" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" style="position:absolute;inset:0;width:100%;height:100%;opacity:0.25;">
          <rect x="10" y="5" width="80" height="90" fill="none" stroke="#fff" stroke-width="0.5"/>
          <line x1="10" y1="50" x2="90" y2="50" stroke="#fff" stroke-width="0.5"/>
          <circle cx="50" cy="50" r="10" fill="none" stroke="#fff" stroke-width="0.5"/>
          <rect x="30" y="5" width="40" height="12" fill="none" stroke="#fff" stroke-width="0.5"/>
          <rect x="30" y="83" width="40" height="12" fill="none" stroke="#fff" stroke-width="0.5"/>
          <rect x="38" y="5" width="24" height="6" fill="none" stroke="#fff" stroke-width="0.5"/>
          <rect x="38" y="89" width="24" height="6" fill="none" stroke="#fff" stroke-width="0.5"/>
          <circle cx="50" cy="7" r="1" fill="#fff"/>
          <circle cx="50" cy="93" r="1" fill="#fff"/>
          <circle cx="50" cy="50" r="0.5" fill="#fff"/>
        </svg>
        ${coords.map((c, i) => {
          const p = assigned[i];
          if (!p) return '';
          return `<div class="pitch-player" style="left:${c[0]}%;top:${c[1]}%">
            <div class="pitch-player-dot team-a-dot">${p.overall}</div>
            <div class="pitch-player-name">${p.name.split(' ').pop()}</div>
          </div>`;
        }).join('')}
      </div>
    </div>
    <div class="card">
      <div class="card-header"><span class="card-title">Lineup</span></div>
      <table><thead><tr><th>#</th><th>Name</th><th>Pos</th><th>OVR</th><th>Form</th></tr></thead><tbody>
      ${assigned.map((p, i) => p ? `
        <tr>
          <td class="td-rank">${i+1}</td>
          <td><span class="td-name">${p.name}</span></td>
          <td><span class="pos-badge ${posClass(p.pos)}">${p.pos}</span></td>
          <td><span class="ovr-badge ${ovrClass(p.overall)}">${p.overall}</span></td>
          <td style="font-size:11px;color:var(--text3)">${p.form}%</td>
        </tr>` : '').join('')}
      </tbody></table>
      <div style="margin-top:20px;">
        <div class="card-title-sm" style="margin-bottom:12px;">Tactical Instructions</div>
        ${renderSlider('Pressing', 'pressing', G.tacticalInstructions.pressing)}
        ${renderSlider('Tempo', 'tempo', G.tacticalInstructions.tempo)}
        ${renderSlider('Width', 'width', G.tacticalInstructions.width)}
      </div>
    </div>
  </div>`;
}

function renderSlider(label, key, val) {
  return `<div style="margin-bottom:14px;">

      <span style="font-size:12px;color:var(--text2)">${label}</span>
      <span style="font-family:var(--font-mono);font-size:12px;color:var(--accent)" id="sl-${key}">${val}</span>

    <input type="range" min="1" max="10" value="${val}" style="width:100%;accent-color:var(--accent);" oninput="G.tacticalInstructions.${key}=+this.value;document.getElementById('sl-${key}').textContent=this.value">

}

function renderFixtures() {
  const team = G.teams.find(t => t.id === G.playerTeamId);
  const myFixtures = G.fixtures.filter(f => f.homeId === G.playerTeamId || f.awayId === G.playerTeamId).slice(0, 38);
  const myResults = G.results.filter(r => r.homeId === G.playerTeamId || r.awayId === G.playerTeamId);

  return `<div class="card">
    <div class="card-header"><span class="card-title">Fixtures & Results</span></div>
    <table><thead><tr><th>MD</th><th>Date</th><th>Home</th><th>Score</th><th>Away</th><th>Venue</th></tr></thead><tbody>
    ${myFixtures.map(f => {
      const result = myResults.find(r => r.id === f.id);
      const hn = G.teams.find(t => t.id === f.homeId)?.name || '?';
      const an = G.teams.find(t => t.id === f.awayId)?.name || '?';
      const isHome = f.homeId === G.playerTeamId;
      let badge = '';
      if (result) {
        const won = isHome ? result.hg > result.ag : result.ag > result.hg;
        const draw = result.hg === result.ag;
        badge = `<span class="badge ${draw?'badge-yellow':won?'badge-green':'badge-red'}">${draw?'D':won?'W':'L'}</span>`;
      }
      return `<tr ${result ? `onclick="showMatchModal(${f.id})" style="cursor:pointer;"` : ''}>
        <td class="td-rank">${f.matchday}</td>
        <td><span class="td-sub">${formatDate(f.date)}</span></td>
        <td><span class="td-name" style="${f.homeId===G.playerTeamId?'color:var(--accent)':''}">${hn}</span></td>
        <td style="text-align:center;font-family:var(--font-mono);font-weight:600;">${result ? `${result.hg}–${result.ag}` : badge || '<span style="color:var(--text3);">vs</span>'}</td>
        <td><span class="td-name" style="${f.awayId===G.playerTeamId?'color:var(--accent)':''}">${an}</span></td>
        <td><span class="td-sub">${G.teams.find(t=>t.id===f.homeId)?.stadium || '?'}</span></td>
      </tr>`;
    }).join('')}
    </tbody></table>
  </div>`;
}

// RENDER — TABLE

        <td class="td-num">${r.d}</td>
        <td class="td-num">${r.l}</td>
        <td class="td-num">${r.gf}</td>
        <td class="td-num">${r.ga}</td>
        <td class="td-num" style="color:${gd>0?'var(--accent)':gd<0?'var(--red)':'var(--text2)'}">${gd>0?'+':''}${gd}</td>

      <span><span style="color:var(--red)">■</span> Relegation Zone</span>

}

  const available = G.players.filter(p => p.teamId !== G.playerTeamId && !p.loaned).sort((a,b) => b.overall - a.overall).slice(0, 60);

  return `<div class="tabs">
    <div class="tab active" onclick="showTransferTab('market')">Transfer Market</div>

    <input class="search-input" id="transfer-search" placeholder="Search players..." oninput="filterTransfers()">
    <select class="form-select" id="transfer-pos" style="width:100px;padding:8px 12px;" onchange="filterTransfers()">
      <option value="">All Pos</option>
      ${['GK','CB','LB','RB','CDM','CM','CAM','LW','RW','ST','CF'].map(p=>`<option>${p}</option>`).join('')}
    </select>
    <select class="form-select" id="transfer-nat" style="width:120px;padding:8px 12px;" onchange="filterTransfers()">
      <option value="">All Nations</option>
      ${NATIONALITIES.map(n=>`<option>${n}</option>`).join('')}
    </select>
  </div>
  <div class="card">
    <div class="table-wrap" id="transfer-table">
      ${renderTransferTable(available)}
    </div>
  </div>
  </div>`;
}

function renderTransferTable(players) {
  return `<table><thead><tr><th>Name</th><th>Nat.</th><th>Age</th><th>Pos</th><th>OVR</th><th>POT</th><th>Club</th><th>Value</th><th>Wage</th><th>Action</th></tr></thead><tbody>
  ${players.map(p => {
    const club = G.teams.find(t => t.id === p.teamId)?.name || 'Free Agent';
    return `<tr onclick="showPlayerModal(${p.id})" style="cursor:pointer;">
      <td><span class="td-name">${p.name}</span></td>
      <td><span class="td-sub">${p.nationality.slice(0,3).toUpperCase()}</span></td>
      <td class="td-num">${p.age}</td>
      <td><span class="pos-badge ${posClass(p.pos)}">${p.pos}</span></td>
      <td><span class="ovr-badge ${ovrClass(p.overall)}">${p.overall}</span></td>
      <td class="td-num" style="color:var(--blue)">${p.potential}</td>
      <td><span class="td-sub">${club}</span></td>
      <td class="td-num">${money(p.value)}</td>
      <td class="td-num" style="color:var(--text3)">£${p.contract.salary.toLocaleString()}</td>
      <td><button class="btn btn-secondary" style="padding:4px 10px;font-size:11px;" onclick="event.stopPropagation();makeOffer(${p.id})">Bid</button></td>
    </tr>`;
  }).join('')}
  </tbody></table>`;
}

function filterTransfers() {
  const q = (document.getElementById('transfer-search')?.value || '').toLowerCase();
  const pos = document.getElementById('transfer-pos')?.value || '';
  const nat = document.getElementById('transfer-nat')?.value || '';
  const players = G.players.filter(p => p.teamId !== G.playerTeamId)
    .filter(p => !q || p.name.toLowerCase().includes(q))
    .filter(p => !pos || p.pos === pos)
    .filter(p => !nat || p.nationality === nat)
    .sort((a,b) => b.overall - a.overall).slice(0, 60);
  const tbl = document.getElementById('transfer-table');
  if (tbl) tbl.innerHTML = renderTransferTable(players);
}

function showTransferTab(tab) {
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', ['market','listed','loans'][i] === tab));
  // Simple — show same content for all tabs in this demo
  filterTransfers();
}

function makeOffer(playerId) {
  const p = G.players.find(x => x.id === playerId);
  const team = G.teams.find(t => t.id === G.playerTeamId);
  if (!p || !team) return;
  const offerVal = p.value;
  if (team.finances.transferBudget < offerVal) {
    toast(`Not enough budget! Need ${money(offerVal)}`, 'error'); return;
  }
  // Success chance based on value match
  const accepted = Math.random() < 0.65;
  if (accepted) {
    // Remove from old team
    const oldTeam = G.teams.find(t => t.id === p.teamId);
    if (oldTeam) oldTeam.squad = oldTeam.squad.filter(id => id !== p.id);
    p.teamId = G.playerTeamId;
    team.squad.push(p.id);
    team.finances.transferBudget -= offerVal;
    toast(`✅ ${p.name} signed for ${money(offerVal)}!`, 'success');
    navigate('transfers');
  } else {
    toast(`❌ ${p.name}'s club rejected the bid`, 'error');
  }
}

function filterAllPlayers() {

    ${G.history.length ? `<table><thead><tr><th>Season</th><th>League</th><th>Champion</th><th>Points</th></tr></thead><tbody>

function renderFinances() {
  const team = G.teams.find(t => t.id === G.playerTeamId);
  const players = team.squad.map(id => G.players.find(p => p.id === id)).filter(Boolean);
  const totalWages = players.reduce((s,p) => s + p.contract.salary, 0);
  const squadValue = players.reduce((s,p) => s + p.value, 0);

  return `
  <div class="grid-3" style="margin-bottom:20px;">
    <div class="stat-box">
      <div class="stat-value">${money(team.finances.transferBudget)}</div>
      <div class="stat-label">Transfer Budget</div>
    </div>
    <div class="stat-box">
      <div class="stat-value">${money(team.finances.wageBudget)}</div>
      <div class="stat-label">Wage Budget</div>
      <div class="stat-sub">${money(totalWages * 52)} / yr used</div>
    </div>
    <div class="stat-box">
      <div class="stat-value">${money(squadValue)}</div>
      <div class="stat-label">Squad Value</div>
    </div>
  </div>
  <div class="card">
    <div class="card-header"><span class="card-title">Player Contracts</span></div>
    <table><thead><tr><th>Name</th><th>Pos</th><th>OVR</th><th>Weekly Wage</th><th>Expires</th><th>Value</th></tr></thead><tbody>
    ${[...players].sort((a,b) => b.contract.salary - a.contract.salary).map(p => `
      <tr onclick="showPlayerModal(${p.id})" style="cursor:pointer;">
        <td><span class="td-name">${p.name}</span></td>
        <td><span class="pos-badge ${posClass(p.pos)}">${p.pos}</span></td>
        <td><span class="ovr-badge ${ovrClass(p.overall)}">${p.overall}</span></td>
        <td class="td-num">£${p.contract.salary.toLocaleString()}</td>
        <td class="td-num" style="color:${p.contract.expires <= G.season+1 ? 'var(--red)' : 'var(--text2)'}">S${p.contract.expires}</td>
        <td class="td-num">${money(p.value)}</td>
      </tr>`).join('')}
    </tbody></table>
  </div>`;
}

  const p = G.players.find(x => x.id === playerId);

    const col = val >= 80 ? 'var(--accent)' : val >= 65 ? 'var(--blue)' : val >= 50 ? 'var(--yellow)' : 'var(--red)';

  document.getElementById('modal-title').textContent = p.name;

    <div style="display:flex;gap:16px;margin-bottom:20px;">

        <span class="ovr-badge ${ovrClass(p.overall)}" style="width:44px;height:44px;font-size:18px;">${p.overall}</span>

      <div style="flex:1;">
        <div style="font-size:11px;color:var(--text3);letter-spacing:2px;text-transform:uppercase;">${p.nationality} · ${p.age} yrs · ${p.foot} foot</div>

          <span class="pos-badge ${posClass(p.pos)}">${p.pos}</span>
          <span class="badge badge-blue">POT ${p.potential}</span>
          ${p.injured ? '<span class="badge badge-red">INJURED</span>' : ''}
        </div>
        <div style="font-size:12px;color:var(--text3);margin-top:6px;">${club} · ${money(p.value)} · £${p.contract.salary.toLocaleString()}pw · Expires S${p.contract.expires}</div>
      </div>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:16px;">
      <div style="flex:1;background:var(--bg3);border-radius:6px;padding:10px;text-align:center;">
        <div style="font-family:var(--font-display);font-size:28px;color:var(--accent)">${p.stats.goals}</div>
        <div style="font-size:10px;color:var(--text3);letter-spacing:2px;">GOALS</div>
      </div>
      <div style="flex:1;background:var(--bg3);border-radius:6px;padding:10px;text-align:center;">
        <div style="font-family:var(--font-display);font-size:28px;color:var(--blue)">${p.stats.assists}</div>

        <div style="font-family:var(--font-display);font-size:28px;color:var(--text)">${p.stats.apps > 0 ? p.stats.rating.toFixed(1) : '—'}</div>
        <div style="font-size:10px;color:var(--text3);letter-spacing:2px;">RATING</div>
      </div>
    </div>
    <div class="grid-2">
      <div>

          <div class="attr-row"><span class="attr-name">${n}</span><span class="attr-val">${v}</span>${attrBar(v)}</div>`).join('')}

function listPlayer(playerId) {
  const p = G.players.find(x => x.id === playerId);
  if (p) { p.forSale = true; p.transferListed = true; toast(`${p.name} listed for transfer`, 'info'); }
  closeModal();
}

function showMatchModal(fixtureId) {
  const result = G.results.find(r => r.id === fixtureId);
  if (!result) return;
  const hn = G.teams.find(t => t.id === result.homeId)?.name || '?';
  const an = G.teams.find(t => t.id === result.awayId)?.name || '?';

  const eventIcon = e => e.type === 'goal' ? '⚽' : e.type === 'yellow' ? '🟨' : e.type === 'red' ? '🟥' : e.type === 'injury' ? '🤕' : '📝';
  const eventClass = e => e.type === 'goal' ? 'event-goal' : e.type === 'yellow' ? 'event-yellow' : e.type === 'red' ? 'event-red' : e.type === 'injury' ? 'event-injury' : '';

  document.getElementById('modal-title').textContent = `${hn} ${result.hg}–${result.ag} ${an}`;
  document.getElementById('modal-content').innerHTML = `
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:0;text-align:center;margin-bottom:20px;background:var(--bg3);border-radius:8px;padding:16px;">
      <div><span style="font-size:11px;color:var(--text3)">POSSESSION</span><br><span style="font-family:var(--font-display);font-size:28px;">${result.stats.homePossession}%</span></div>
      <div style="border-left:1px solid var(--border);border-right:1px solid var(--border);">
        <div style="font-family:var(--font-display);font-size:48px;line-height:1;color:var(--text)">${result.hg}–${result.ag}</div>
      </div>
      <div><span style="font-size:11px;color:var(--text3)">POSSESSION</span><br><span style="font-family:var(--font-display);font-size:28px;">${result.stats.awayPossession}%</span></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr auto 1fr;gap:8px;margin-bottom:20px;font-size:12px;">
      ${[
        [result.stats.homeShots, 'Shots', result.stats.awayShots],
        [result.stats.homeSot, 'On Target', result.stats.awaySot],
        [result.stats.homeXg, 'xG', result.stats.awayXg],
        [result.stats.homeCorners, 'Corners', result.stats.awayCorners],
        [result.stats.homeFouls, 'Fouls', result.stats.awayFouls],
      ].map(([h,l,a]) => `
        <span style="text-align:right;font-family:var(--font-mono)">${h}</span>
        <span style="text-align:center;color:var(--text3);font-size:10px;letter-spacing:1px;">${l}</span>
        <span style="text-align:left;font-family:var(--font-mono)">${a}</span>`).join('')}
    </div>
    <div class="match-feed">
      ${result.events.map(e => `
        <div class="match-event ${eventClass(e)}">
          <span class="event-min">${e.min}'</span>
          <span class="event-icon">${eventIcon(e)}</span>
          <span class="event-text">
            ${e.type === 'goal' ? `<strong>GOAL!</strong> ${e.playerName}${e.assistName ? ` <span style="color:var(--text3)">(${e.assistName})</span>` : ''}` :
              e.type === 'yellow' ? `Yellow card: <strong>${e.playerName}</strong>` :
              e.type === 'injury' ? `Injury concern: <strong>${e.playerName}</strong>` :
              `<strong>${e.playerName}</strong>`}
          </span>
        </div>`).join('')}
    </div>
  `;
  openModal();
}

function openModal() { document.getElementById('modal-overlay').classList.add('open'); }
function closeModal() { document.getElementById('modal-overlay').classList.remove('open'); }

// ================================================================
// SETUP SCREEN
// ================================================================
function renderTeamPicker() {
  const leagueKey = document.getElementById('league-pick').value;
  const ld = LEAGUE_DATA[leagueKey];
  const container = document.getElementById('team-picker');
  container.innerHTML = ld.teams.slice(0, 20).map((name, i) => `
    <div class="team-pick" onclick="selectTeam(this, ${i})" data-id="${i}">
      <div class="team-pick-name">${name}</div>
      <div class="team-pick-meta">${ld.country}</div>
    </div>`).join('');
}

let selectedTeamIdx = 0;
function selectTeam(el, idx) {
  document.querySelectorAll('.team-pick').forEach(e => e.classList.remove('selected'));
  el.classList.add('selected');
  selectedTeamIdx = idx;
}

async function startGame() {
  const name = document.getElementById('mgr-name').value.trim() || 'Manager';
  const leagueKey = document.getElementById('league-pick').value;
  G.manager = name;

  // Show loading
  document.getElementById('setup-loading').style.display = 'block';
  const fill = document.getElementById('loading-fill');
  let p = 0;
  const interval = setInterval(() => { p = Math.min(p + rand(5,15), 90); fill.style.width = p + '%'; }, 100);

  await new Promise(r => setTimeout(r, 800));
  generateWorld(leagueKey);
  G.playerTeamId = selectedTeamIdx;

  clearInterval(interval);
  fill.style.width = '100%';
  await new Promise(r => setTimeout(r, 300));

  document.getElementById('setup-screen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  navigate('dashboard');
  toast(`⚽ Welcome, ${name}! Managing ${G.teams.find(t=>t.id===G.playerTeamId)?.name}`, 'success');
}

// ================================================================
// INIT
// ================================================================
renderTeamPicker();
// Pre-select first team
setTimeout(() => {
  const first = document.querySelector('.team-pick');
  if (first) { first.classList.add('selected'); selectedTeamIdx = 0; }
}, 100);

// Click outside modal to close
document.getElementById('modal-overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('modal-overlay')) closeModal();
});
</script>
